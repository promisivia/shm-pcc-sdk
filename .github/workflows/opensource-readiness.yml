name: Open-source readiness

on:
  push:
    branches: [master, opensource]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libboost-all-dev libcityhash-dev libibverbs-dev \
            libjemalloc-dev libmemkind-dev libnuma-dev libssh-dev libtbb-dev

      - name: Install documentation dependencies
        run: python -m pip install -r website/requirements.txt

      - name: Run full readiness harness
        run: ./tools/opensource-harness/run.sh --full --report /tmp/cxl-sdk-readiness.json

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-source-readiness-report
          path: /tmp/cxl-sdk-readiness.json
          if-no-files-found: ignore
