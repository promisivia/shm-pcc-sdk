title=config.ini

[debug]
follower=false

[shm/cacheable]
mem_type=cxl
; "cxl"
device_path=/dev/shm/cxl
mmap_base_addr=0xcaffe0000000
mem_size=65536
ub_name=pcc-shm-250
; 16GB

[shm/uncacheable]
mem_type=local
; "cxl"
device_path=/dev/uncached_mem_dev
mmap_base_addr=0xcadfe000000
mem_size=128
; 128MB
