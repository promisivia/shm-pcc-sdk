title=config.ini

[debug]
follower=false

[shm/cacheable]
mem_type=cxl
; "cxl"
device_path=/dev/dax0.0
mmap_base_addr=0xcaffe0000000
mem_size=65536
; 16GB
; Lower allocator: memkind (default) or cxlalloc (requires CMake WITH_CXLALLOC=ON)
allocator_backend=memkind
; cxlalloc_thread_count=256
; cxlalloc_heap_numa=-1

[shm/uncacheable]
mem_type=local
; "cxl"
device_path=/dev/uncached_mem_dev
mmap_base_addr=0xcadfe000000
mem_size=128
; 128MB
